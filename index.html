        <!-- Domain-scoped maintenance overlay: does not change the React app or its routing. -->
        <style>
            #vintel-maintenance[hidden] { display:none !important; }
            #vintel-maintenance { position:fixed; inset:0; z-index:2147483647; display:grid; place-items:center; overflow:auto; padding:22px; box-sizing:border-box; color:#f4f8ff; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(ellipse at 15% 15%,rgba(0,210,190,.18),transparent 42%),radial-gradient(ellipse at 85% 85%,rgba(65,100,255,.22),transparent 42%),#07111f; }
            #vintel-maintenance:before,#vintel-maintenance:after { content:""; position:absolute; width:44vmin; height:44vmin; border:1px solid rgba(105,226,221,.16); border-radius:50%; pointer-events:none; animation:vm-orbit 20s linear infinite; }
            #vintel-maintenance:before { top:-15vmin; right:-9vmin; } #vintel-maintenance:after { bottom:-22vmin; left:-10vmin; width:58vmin;height:58vmin;animation-direction:reverse; }
            #vintel-maintenance .vm-card { position:relative; width:min(100%,600px); box-sizing:border-box; padding:clamp(26px,6vw,50px); text-align:center; border:1px solid rgba(193,224,245,.17); border-radius:26px; background:linear-gradient(145deg,rgba(20,38,59,.95),rgba(10,22,39,.96)); box-shadow:0 24px 100px rgba(0,0,0,.4); animation:vm-enter .65s ease-out both; }
            #vintel-maintenance .vm-logo { width:76px;height:76px;margin:0 auto 22px;display:grid;place-items:center;border-radius:23px;color:#06201f;font-size:30px;font-weight:850;letter-spacing:-2px;background:linear-gradient(135deg,#7cf7dc,#56b8ff);box-shadow:0 0 38px rgba(75,221,206,.23);animation:vm-glow 3s ease-in-out infinite; }
            #vintel-maintenance .vm-status { display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid rgba(111,231,207,.22);border-radius:999px;color:#a6f4df;background:rgba(60,209,173,.08);font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase; }
            #vintel-maintenance .vm-dot { width:7px;height:7px;border-radius:50%;background:#64e8c2;box-shadow:0 0 12px #64e8c2;animation:vm-pulse 1.6s ease-in-out infinite; }

            #vintel-maintenance .vm-copy { max-width:440px;margin:0 auto;color:#b6c5d5;font-size:15px;line-height:1.8; }
            #vintel-maintenance .vm-label { margin:28px 0 12px;color:#849bb1;font-size:10px;font-weight:750;letter-spacing:.2em;text-transform:uppercase; }
            #vintel-maintenance .vm-countdown { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px; }
            #vintel-maintenance .vm-unit { padding:14px 4px 11px;border:1px solid rgba(176,211,237,.12);border-radius:13px;background:rgba(255,255,255,.035); }
            #vintel-maintenance .vm-number { display:block;font-size:clamp(24px,6vw,33px);font-weight:750;line-height:1.2;font-variant-numeric:tabular-nums; }
            #vintel-maintenance .vm-unit-label { display:block;margin-top:7px;color:#91a7bd;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase; }
            #vintel-maintenance .vm-foot { margin-top:22px;color:#6f879f;font-size:11px; }
            @keyframes vm-enter { from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)} }
            @keyframes vm-pulse { 50%{opacity:.4;transform:scale(.8)} }
            @keyframes vm-glow { 50%{box-shadow:0 0 48px rgba(75,221,206,.35)} }
            @keyframes vm-orbit { to{transform:rotate(360deg)} }

            @media(prefers-reduced-motion:reduce){#vintel-maintenance *,#vintel-maintenance:before,#vintel-maintenance:after{animation:none!important}}

        <section id="vintel-maintenance" role="dialog" aria-modal="true" aria-labelledby="vm-title" hidden>
            <div class="vm-card">
                <div class="vm-logo" aria-hidden="true">VT</div>
                <div class="vm-status"><span class="vm-dot" aria-hidden="true"></span> Scheduled maintenance</div>
                <h1 id="vm-title">Hello trader<span class="vm-accent">.!</span></h1>
                <p class="vm-copy"><strong class="vm-accent">Vinteltool is under maintenance.</strong> We apologize for any inconveniences. The site will be available within 24hrs.</p>
                <p class="vm-label">Time until we’re back</p>
                <div class="vm-countdown" aria-label="Maintenance countdown">
                    <div class="vm-unit"><span class="vm-number" id="vm-days">00</span><span class="vm-unit-label">Days</span></div>
                    <div class="vm-unit"><span class="vm-number" id="vm-hours">24</span><span class="vm-unit-label">Hours</span></div>
                    <div class="vm-unit"><span class="vm-number" id="vm-minutes">00</span><span class="vm-unit-label">Minutes</span></div>
                    <div class="vm-unit"><span class="vm-number" id="vm-seconds">00</span><span class="vm-unit-label">Seconds</span></div>
                </div>
                <p class="vm-foot">Thank you for your patience · Vinteltool</p>
            </div>
        </section>
        <script>
            (function () {
                var host = window.location.hostname.toLowerCase().replace(/^www\./, '');
                if (host !== 'vinteltool.site') return;
                var screen = document.getElementById('vintel-maintenance');
                var root = document.getElementById('root');
                if (!screen || !root) return;
                // One shared 24-hour deadline for all visitors, in UTC.
                var deadline = Date.parse('2026-10-25T05:52:00Z');
                var timer = null;
                function updateCountdown() {
                    var seconds = Math.max(0, Math.floor((deadline - Date.now()) / 1000));
                    var values = {
                        'vm-days': Math.floor(seconds / 86400),
                        'vm-hours': Math.floor((seconds % 86400) / 3600),
                        'vm-minutes': Math.floor((seconds % 3600) / 60),
                        'vm-seconds': seconds % 60
                    };
                    Object.keys(values).forEach(function (id) {
                        var el = document.getElementById(id);
                        if (el) el.textContent = String(values[id]).padStart(2, '0');
                    });
                    if (seconds <= 0) {
                        screen.hidden = true;
                        document.body.style.overflow = '';
                        if (timer) clearInterval(timer);
                        return;
                    }
                }
                function showMaintenance() {
                    if (screen.hidden === false) return;
                    screen.hidden = false;
                    document.body.style.overflow = 'hidden';
                    updateCountdown();
                    timer = setInterval(updateCountdown, 1000);
                }
                function waitForInitialization() {
                    var quietTimer = null;
                    var observer = new MutationObserver(function () {
                        if (quietTimer) clearTimeout(quietTimer);
                        if (root.childElementCount > 0) quietTimer = setTimeout(finish, 700);
                    });
                    function finish() {
                        observer.disconnect();
                        if (quietTimer) clearTimeout(quietTimer);
                        showMaintenance();
                    }
                    observer.observe(root, { childList: true, subtree: true });
                    if (root.childElementCount > 0) quietTimer = setTimeout(finish, 700);
                    // Fail safe only if app bootstrap has stalled; never blank the page indefinitely.
                    setTimeout(function () { if (screen.hidden) finish(); }, 15000);
                }
                if (document.readyState === 'complete') waitForInitialization();
                else window.addEventListener('load', waitForInitialization, { once: true });
                document.addEventListener('keydown', function (event) {
                    if (!screen.hidden && (event.key === 'Tab' || event.key === 'Escape')) {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                    }
                }, true);
                document.addEventListener('click', function (event) {
                    if (!screen.hidden && !screen.contains(event.target)) {
                        event.preventDefault();
                        event.stopImmediatePropagation();
                    }
                }, true);
            })();
        </script>
