        <script src="<%= assetPrefix %>/risk-disclaimer.js"></script>
        <script>
            /* Guaranteed fallback: keep the floating Risk Disclaimer visible even if the public script is not loaded by the deployed bundle. */
            (function () {
                function ensureRiskDisclaimer() {
                    if (document.getElementById('vintel-risk-disclaimer-button')) return;

                    var button = document.createElement('button');
                    button.id = 'vintel-risk-disclaimer-button';
                    button.type = 'button';
                    button.setAttribute('aria-label', 'Risk Disclaimer');
                    button.textContent = '⚠️ Risk Disclaimer';
                    button.style.cssText = 'position:fixed!important;left:14px!important;bottom:150px!important;z-index:2147483647!important;border:0!important;border-radius:7px!important;background:#f5c400!important;color:#111!important;padding:9px 12px!important;font:700 14px/1.2 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;box-shadow:0 3px 12px rgba(0,0,0,.35)!important;cursor:pointer!important;white-space:nowrap!important;touch-action:manipulation!important;display:block!important;visibility:visible!important;opacity:1!important';

                    var overlay = document.createElement('div');
                    overlay.id = 'vintel-risk-disclaimer-overlay';
                    overlay.style.cssText = 'display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.48);align-items:center;justify-content:center;padding:16px;box-sizing:border-box';

                    var modal = document.createElement('div');
                    modal.style.cssText = 'position:relative;width:min(576px,100%);max-height:82vh;overflow:auto;box-sizing:border-box;background:#fff;color:#555;border-radius:14px;padding:24px 28px;font:400 16px/1.7 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 16px 50px rgba(0,0,0,.35)';
                    modal.innerHTML = '<button type="button" aria-label="Close" data-risk-close style="position:absolute;right:14px;top:12px;border:0;background:transparent;color:#888;font-size:25px;line-height:1;cursor:pointer">×</button>' +
                        '<h2 style="margin:0 34px 8px 0;color:#3d3d3d;font-size:20px;line-height:1.3">Risk Disclaimer</h2>' +
                        '<p>Deriv offers complex derivatives, such as options and contracts for difference (“CFDs”). These products may not be suitable for all clients, and trading them puts you at risk. Please make sure that you understand the following risks before trading Deriv products:</p>' +
                        '<ul style="padding-left:30px;margin:10px 0 16px"><li>You may lose some or all of the money you invest in the trade.</li><li>If your trade involves currency conversion, exchange rates will affect your profit and loss.</li></ul>' +
                        '<p>You should never trade with borrowed money or with money that you cannot afford to lose.</p>' +
                        '<button type="button" data-risk-close style="border:0;border-radius:5px;background:#12e000;color:#111;padding:8px 10px;font-size:16px;cursor:pointer">Close</button>';

                    overlay.appendChild(modal);
                    document.body.appendChild(button);
                    document.body.appendChild(overlay);
                    button.addEventListener('click', function () { overlay.style.display = 'flex'; });
                    overlay.addEventListener('click', function (event) {
                        if (event.target === overlay || event.target.hasAttribute('data-risk-close')) overlay.style.display = 'none';
                    });
                }

                function start() {
                    ensureRiskDisclaimer();
                    setTimeout(ensureRiskDisclaimer, 500);
                    setTimeout(ensureRiskDisclaimer, 1500);
                }

                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
                else start();
            })();
        </script>
